# Sobe tudo com um comando:  docker compose up --build
#   Frontend: http://localhost:3000   ·   API/Swagger: http://localhost:8080/swagger   ·   SQL Server: localhost:1433
#
# Ordem de subida: sqlserver (healthy) -> db-init (roda database/*.sql e termina) -> api (healthy) -> frontend

name: mini-gestao-pedidos

x-sa-password: &sa-password ${MSSQL_SA_PASSWORD:-Pedidos_Dev2026}

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: *sa-password
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Container de vida curta: executa os scripts (idempotentes) e encerra com código 0.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: *sa-password
      DB_HOST: sqlserver
    volumes:
      - ./database:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/init.sh"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/Pedidos.Api/Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development # habilita detalhes de erro; Swagger fica disponível em qualquer ambiente
      ConnectionStrings__Pedidos: "Server=sqlserver,1433;Database=Pedidos;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Pedidos_Dev2026};TrustServerCertificate=True;Encrypt=False"
    ports:
      - "8080:8080"
    healthcheck:
      # A imagem aspnet não tem curl/wget; bash consegue abrir TCP via /dev/tcp.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  sqlserver-data:
